name: flowboard
description: "FlowBoard - mobile-first offline-first Kanban for small teams."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  drift: ">=2.34.0 <2.35.0"
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  # Version is pinned by flutter_localizations.
  intl: any
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
